name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: Build variant
        required: true
        default: release
        type: choice
        options:
          - debug
          - release
      release_tag:
        description: Existing release tag to attach the release APK to (optional)
        required: false
        type: string

permissions:
  contents: write

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '21'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            cmake;3.22.1
            ndk;27.0.12077973

      # npm install triggers sharp's libvips download, which times out on
      # hosted runners. The browser build does not execute sharp or the native
      # ONNX runtime, so install without lifecycle scripts and keep only
      # production dependencies. esbuild ships its platform binary through an
      # optional package, so it still works after scripts are skipped.
      - name: Install dependencies
        run: npm ci --omit=dev --legacy-peer-deps --ignore-scripts

      - name: Verify build toolchain
        run: npx --no-install vite --version

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android
      - name: Decode Android Keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'android' }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 --decode > android/app/release.keystore
          else
            echo "Generating fallback keystore for CI..."
            keytool -genkey -v -keystore android/app/release.keystore -alias kryptonide -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=KryptonIDE, OU=Dev, O=Krypton, L=Dev, S=Dev, C=US"
          fi
      - name: Signing Report
        run: |
          cd android
          chmod +x gradlew
          ./gradlew signingReport

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'android' }}
          BUILD_TYPE: ${{ inputs.build_type || 'release' }}
        run: |
          chmod +x gradlew
          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew assembleDebug
          else
            ./gradlew assembleRelease
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: krypton-ide-${{ inputs.build_type || 'release' }}
          path: android/app/build/outputs/apk/${{ inputs.build_type || 'release' }}/*.apk
          retention-days: 30

      - name: Attach APK to release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && (inputs.build_type || 'release') == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/release/app-release.apk "dist-apk/krypton-ide-${TAG}-release.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "dist-apk/kryptonide-${TAG}-release.apk"
          gh release upload "$TAG" "dist-apk/krypton-ide-${TAG}-release.apk" "dist-apk/kryptonide-${TAG}-release.apk" --clobber
