[package]
name = "krypton-core-rs"
version = "0.1.0"
edition = "2021"
description = "High-performance Rust search and diff acceleration engine for Kryptonide"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
similar = { version = "2.4", features = ["inline"] }
sha2 = "0.10"
byteorder = "1.5"
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
crc32fast = "1.4"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libc = "0.2"
memmap2 = "0.9"
jni = { version = "0.21", default-features = false }
rquickjs = { version = "0.14", features = ["classes", "properties", "macro"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
