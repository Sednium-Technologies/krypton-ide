  <body>
    <script>
      window.__ERRORS__ = [];
      window.addEventListener('error', function(e) {
        window.__ERRORS__.push(e.message || (e.error && e.error.message) || String(e));
      });
      window.addEventListener('unhandledrejection', function(e) {
        window.__ERRORS__.push('UnhandledRejection: ' + ((e.reason && e.reason.message) || String(e.reason)));
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
